<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chartz · ECharts 6.1.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8f9fa; }
  .wrap { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 1.25rem; }
  #chart { width: 100%; height: 65vh; }
  footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><div id="chart"></div></div>
  <footer>chartz · ECharts 6.1.0 · single-file, CDN-pinned</footer>
</div>
<script>
const SPEC = {
  "title": {
    "text": "Functional annotation (COG categories)",
    "left": "center",
    "top": "5%"
  },
  "tooltip": {
    "trigger": "item"
  },
  "series": [
    {
      "type": "sunburst",
      "radius": [
        "18%",
        "78%"
      ],
      "emphasis": {
        "focus": "ancestor"
      },
      "label": {
        "rotate": "radial"
      },
      "data": [
        {
          "name": "Metabolism",
          "children": [
            {
              "name": "Amino acid",
              "value": 310
            },
            {
              "name": "Carbohydrate",
              "value": 264
            },
            {
              "name": "Energy",
              "value": 158
            },
            {
              "name": "Lipid",
              "value": 96
            }
          ]
        },
        {
          "name": "Information storage",
          "children": [
            {
              "name": "Translation",
              "value": 178
            },
            {
              "name": "Transcription",
              "value": 112
            },
            {
              "name": "Replication",
              "value": 84
            }
          ]
        },
        {
          "name": "Cellular processes",
          "children": [
            {
              "name": "Cell wall",
              "value": 74
            },
            {
              "name": "Cell motility",
              "value": 52
            }
          ]
        },
        {
          "name": "Poorly characterized",
          "children": [
            {
              "name": "Function unknown",
              "value": 210
            }
          ]
        }
      ]
    }
  ]
};
const chart = echarts.init(document.getElementById('chart'));
chart.setOption(SPEC);
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
