/* SeqLogo renderer — template-native SVG, no external library.
   Spec: { title,
           positions: [ [ {letter, height}, ... ], ... ],  // per-position stacks, bottom-up; heights in bits
           ymax: 2,                                        // bits axis max (2 DNA / 4.32 protein)
           ylabel?: "Bits",
           colors: { letter: hex },
           xlabels?: [...] }                               // per-position labels (default 1..n)
   The agent computes information content UPSTREAM (Schneider-Stephens 1990,
   background-corrected, small-sample corrected) and emits per-letter heights;
   the renderer only stacks glyphs bottom-up (Logomaker's approach). */
(function render() {
  const NS = "http://www.w3.org/2000/svg";
  const GUT_L = 60, AXIS_W = 22, GUT_T = 16;
  const PLOT_W = 860, PLOT_H = 240;
  const n = SPEC.positions.length;
  const colW = PLOT_W / n;
  const ymax = SPEC.ymax || 2;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${GUT_L + AXIS_W + PLOT_W + 30} ${GUT_T + AXIS_W + PLOT_H + 30}`);
  svg.setAttribute("style", "font-family: system-ui, sans-serif;");
  const el = (tag, attrs, text) => {
    const nn = document.createElementNS(NS, tag);
    for (const k in attrs) nn.setAttribute(k, attrs[k]);
    if (text !== undefined) nn.textContent = text;
    svg.appendChild(nn);
    return nn;
  };
  const PX = GUT_L + AXIS_W;
  const baseY = GUT_T + AXIS_W + PLOT_H;
  // y axis
  el("line", {x1: PX, x2: PX, y1: GUT_T, y2: baseY, stroke: "#333"});
  const ticks = ymax <= 2 ? [0, 0.5, 1, 1.5, 2] : [0, 1, 2, 3, 4];
  for (const tv of ticks) {
    if (tv > ymax) continue;
    const y = baseY - (tv / ymax) * PLOT_H;
    el("line", {x1: PX - 4, x2: PX, y1: y, y2: y, stroke: "#333"});
    el("text", {x: PX - 7, y: y + 3, "text-anchor": "end", "font-size": 10, fill: "#333"}, String(tv));
  }
  const yl = GUT_T + AXIS_W + PLOT_H / 2;
  el("text", {x: PX - 40, y: yl, "font-size": 11, fill: "#333", "text-anchor": "middle",
              transform: `rotate(-90 ${PX - 40} ${yl})`}, SPEC.ylabel || "Bits");
  // letter stacks (bottom-up)
  SPEC.positions.forEach((stack, i) => {
    const cx = PX + (i + 0.5) * colW;
    let acc = 0;                             // bits consumed from the baseline up
    for (const item of stack) {
      const hPx = (item.height / ymax) * PLOT_H;
      const baseline = baseY - (acc / ymax) * PLOT_H;
      const fs = Math.max(6, hPx * 1.32);    // font-size tuned so glyph box ≈ stack band
      el("text", {x: cx, y: baseline + 2, "text-anchor": "middle",
                  "font-size": fs, "font-weight": "bold",
                  fill: (SPEC.colors || {})[item.letter] || "#555555"}, item.letter);
      acc += item.height;
    }
  });
  // x labels
  for (let i = 0; i < n; i++) {
    const cx = PX + (i + 0.5) * colW;
    const lbl = SPEC.xlabels ? String(SPEC.xlabels[i]) : String(i + 1);
    el("text", {x: cx, y: baseY + 16, "text-anchor": "middle", "font-size": 10, fill: "#333"}, lbl);
  }
  document.getElementById("chart").appendChild(svg);
})();
