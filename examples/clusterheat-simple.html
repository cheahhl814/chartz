<!DOCTYPE html>
<html lang="en">

<title>chartz · ClusterHeat (template-native SVG)</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8f9fa; }
  .wrap { max-width: 1060px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 1.25rem; }
  h1 { font-size: 1rem; color: #333; margin: 0 0 1rem; font-weight: 600; }
  #chart { width: 100%; }
  footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 1rem; }

<body>
<div class="wrap">
  <div class="card">
    <h1 id="chart-title"></h1>
    <div id="chart"></div>
  </div>
  <footer>chartz · ClusterHeat (engine 6) · template-native SVG, zero dependencies</footer>
</div>
<script>
const SPEC = {

  },

      ],

    ],
    "height": 55
  },
  "col_annot": [
    {
      "label": "Group",
      "height": 14,
      "values": [
        "Normal",
        "Cancer",
        "Cancer",
        "Normal",
        "Normal",
        "Cancer"
      ],
      "colors": {
        "Cancer": "#D55E00",
        "Normal": "#009E73"
      }
    }
  ]
};
document.getElementById('chart-title').textContent = SPEC.title || 'Clustered heatmap';

/* ClusterHeat renderer — template-native SVG, no external library.
   Spec: { title,
           matrix: {rows, cols, z, scale (normalized stops), zmin, zmax, legendLabel?},
           row_dend?: {merge: [[a,b,h]...], height?},   // left side
           col_dend?: {merge: [[a,b,h]...], height?},   // top side
           col_annot?: [{label, height?, values, colors}],
           row_annot?: [{label, height?, values, colors}] }
   The matrix is emitted ALREADY ordered — the agent clusters upstream
   (scipy 'ward' / R 'ward.D2') and passes the linkage merge list.
   merge indices: leaves are 0..n-1 in matrix order; the internal node
   created by merge k is n+k. Branch depth is PROPORTIONAL to merge height
   (unlike ECharts tree). */
(function render() {
  const NS = "http://www.w3.org/2000/svg";
  const M = SPEC.matrix;
  const nR = M.rows.length, nC = M.cols.length;
  const GUT_L = 150, GUT_T = 20;
  const DEND_R = SPEC.row_dend ? (SPEC.row_dend.height || 70) : 0;
  const DEND_C = SPEC.col_dend ? (SPEC.col_dend.height || 70) : 0;
  const ANN_R = SPEC.row_annot ? SPEC.row_annot.reduce((a, s) => a + (s.height || 14), 0) : 0;
  const ANN_C = SPEC.col_annot ? SPEC.col_annot.reduce((a, s) => a + (s.height || 14), 0) : 0;
  const CELL_W = Math.max(14, Math.floor(760 / nC));
  const CELL_H = Math.max(14, Math.floor(420 / nR));
  const MAT_W = CELL_W * nC, MAT_H = CELL_H * nR;
  const MAT_X = GUT_L + DEND_R + ANN_R, MAT_Y = GUT_T + DEND_C + ANN_C;
  const legendKeyCount = new Set([
    ...(SPEC.col_annot || []).flatMap(s => Object.keys(s.colors)),
    ...(SPEC.row_annot || []).flatMap(s => Object.keys(s.colors)),
  ]).size;
  const LEGEND_H = legendKeyCount ? 40 + legendKeyCount * 14 : 30; // must match the legend loop below

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${MAT_X + MAT_W + 130} ${MAT_Y + MAT_H + LEGEND_H}`);
  svg.setAttribute("style", "font-family: system-ui, sans-serif;");
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  };

  // colorscale interpolation over normalized stops [[0, hex], ..., [1, hex]]
  const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const stops = M.scale.map(s => [s[0], hex2rgb(s[1])]);
  const colorFor = v => {
    let t = Math.max(0, Math.min(1, (v - M.zmin) / (M.zmax - M.zmin)));
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const f = (t - stops[i - 1][0]) / ((stops[i][0] - stops[i - 1][0]) || 1);
        const c = stops[i - 1][1].map((a, k) => Math.round(a + f * (stops[i][1][k] - a)));
        return `rgb(${c[0]},${c[1]},${c[2]})`;
      }
    }
    return `rgb(${stops[stops.length - 1][1].join(",")})`;
  };

  // cell grid
  for (let r = 0; r < nR; r++)
    for (let c = 0; c < nC; c++)
      el("rect", {x: MAT_X + c * CELL_W, y: MAT_Y + r * CELL_H,
                  width: CELL_W - 1, height: CELL_H - 1, fill: colorFor(M.z[r][c])});

  // labels
  M.rows.forEach((r, i) => el("text", {x: MAT_X - 6, y: MAT_Y + i * CELL_H + CELL_H / 2 + 3,
    "text-anchor": "end", "font-size": 10, fill: "#333"}, r));
  M.cols.forEach((c, j) => {
    const x = MAT_X + j * CELL_W + CELL_W / 2, y = MAT_Y + MAT_H + 12;
    el("text", {x, y, "text-anchor": "start", "font-size": 10, fill: "#333",
                transform: `rotate(-45 ${x} ${y})`}, c);
  });

  // color legend
  const LG_H = 90, LG_X = MAT_X + MAT_W + 30, LG_Y = MAT_Y;
  for (let i = 0; i < LG_H; i++) {
    const v = M.zmax - (i / LG_H) * (M.zmax - M.zmin);
    el("rect", {x: LG_X, y: LG_Y + i, width: 14, height: 1, fill: colorFor(v)});
  }
  el("text", {x: LG_X + 18, y: LG_Y + 8, "font-size": 10, fill: "#333"}, M.zmax);
  el("text", {x: LG_X + 18, y: LG_Y + LG_H, "font-size": 10, fill: "#333"}, M.zmin);
  if (M.legendLabel) el("text", {x: LG_X + 18, y: LG_Y + LG_H / 2, "font-size": 10, fill: "#666"}, M.legendLabel);

  // column annotation strips (above matrix) + class legend
  let ay = MAT_Y - ANN_C;
  if (SPEC.col_annot) for (const s of SPEC.col_annot) {
    el("text", {x: 6, y: ay + s.height - 3, "font-size": 10, fill: "#444", "font-weight": 600}, s.label);
    s.values.forEach((v, j) => el("rect", {x: MAT_X + j * CELL_W, y: ay,
      width: CELL_W - 1, height: s.height, fill: s.colors[v] || "#DDDDDD"}));
    ay += s.height;
  }
  const legend = {};
  (SPEC.col_annot || []).forEach(s => Object.entries(s.colors).forEach(([k, c]) => legend[k] = c));
  (SPEC.row_annot || []).forEach(s => Object.entries(s.colors).forEach(([k, c]) => legend[k] = c));
  let ly = MAT_Y + MAT_H + 40;
  for (const [k, c] of Object.entries(legend)) {
    el("rect", {x: MAT_X + 20, y: ly - 8, width: 10, height: 10, fill: c});
    el("text", {x: MAT_X + 34, y: ly, "font-size": 10, fill: "#444"}, k);
    ly += 14;
  }

  // row annotation strips (left of matrix, vertical)
  let ax = GUT_L + DEND_R;
  if (SPEC.row_annot) for (const s of SPEC.row_annot) {
    s.values.forEach((v, i) => el("rect", {x: ax, y: MAT_Y + i * CELL_H,
      width: s.height, height: CELL_H - 1, fill: s.colors[v] || "#DDDDDD"}));
    const tx = ax + s.height / 2, ty = MAT_Y - 6;
    el("text", {x: tx, y: ty, "text-anchor": "start", "font-size": 10, fill: "#444",
                "font-weight": 600, transform: `rotate(-45 ${tx} ${ty})`}, s.label);
    ax += s.height;
  }

  // dendrograms: merge list -> U-shaped segments; branch depth ∝ merge height
  function dendro(merge, nLeaves) {
    const pos = [], hgt = [];
    for (let i = 0; i < nLeaves; i++) { pos[i] = i + 0.5; hgt[i] = 0; }
    const maxH = Math.max(...merge.map(m => m[2])) || 1;
    const us = [];
    merge.forEach((m, k) => {
      const [a, b, h] = m;
      us.push({pa: pos[a], ha: hgt[a], pb: pos[b], hb: hgt[b], h});
      pos[nLeaves + k] = (pos[a] + pos[b]) / 2;
      hgt[nLeaves + k] = h;
    });
    return {us, maxH};
  }
  if (SPEC.col_dend) {
    const d = dendro(SPEC.col_dend.merge, nC), H = SPEC.col_dend.height || 70;
    const baseY = MAT_Y - ANN_C;   // dendrogram sits ABOVE the annotation strips
    for (const u of d.us) {
      const x1 = MAT_X + u.pa * CELL_W, x2 = MAT_X + u.pb * CELL_W;
      const yU = baseY - (u.h / d.maxH) * H;
      const ya = baseY - (u.ha / d.maxH) * H, yb = baseY - (u.hb / d.maxH) * H;
      el("path", {d: `M ${x1} ${ya} L ${x1} ${yU} L ${x2} ${yU} L ${x2} ${yb}`,
                  fill: "none", stroke: "#555", "stroke-width": 1});
    }
  }
  if (SPEC.row_dend) {
    const d = dendro(SPEC.row_dend.merge, nR), H = SPEC.row_dend.height || 70;
    const baseX = MAT_X - ANN_R;   // dendrogram sits LEFT of the annotation strips
    for (const u of d.us) {
      const y1 = MAT_Y + u.pa * CELL_H, y2 = MAT_Y + u.pb * CELL_H;
      const xU = baseX - (u.h / d.maxH) * H;
      const xa = baseX - (u.ha / d.maxH) * H, xb = baseX - (u.hb / d.maxH) * H;
      el("path", {d: `M ${xa} ${y1} L ${xU} ${y1} L ${xU} ${y2} L ${xb} ${y2}`,
                  fill: "none", stroke: "#555", "stroke-width": 1});
    }
  }
  document.getElementById("chart").appendChild(svg);
})();
</script>
</body>
</html>
