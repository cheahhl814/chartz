<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chartz · ECharts 6.1.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8f9fa; }
  .wrap { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 1.25rem; }
  #chart { width: 100%; height: 65vh; }
  footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><div id="chart"></div></div>
  <footer>chartz · ECharts 6.1.0 · single-file, CDN-pinned</footer>
</div>
<script>
const SPEC = {
  "title": {
    "text": "Grant allocation by cost category",
    "left": "center",
    "top": "3%"
  },
  "tooltip": {
    "trigger": "item"
  },
  "series": [
    {
      "type": "sankey",
      "emphasis": {
        "focus": "adjacency"
      },
      "data": [
        {
          "name": "R01 Grant",
          "itemStyle": {
            "color": "#0072B2"
          }
        },
        {
          "name": "Sequencing",
          "itemStyle": {
            "color": "#E69F00"
          }
        },
        {
          "name": "Personnel",
          "itemStyle": {
            "color": "#009E73"
          }
        },
        {
          "name": "Reagents & Consumables",
          "itemStyle": {
            "color": "#D55E00"
          }
        }
      ],
      "links": [
        {
          "source": "R01 Grant",
          "target": "Sequencing",
          "value": 120000
        },
        {
          "source": "R01 Grant",
          "target": "Personnel",
          "value": 90000
        },
        {
          "source": "R01 Grant",
          "target": "Reagents & Consumables",
          "value": 40000
        }
      ],
      "top": "12%"
    }
  ]
};
const chart = echarts.init(document.getElementById('chart'));
chart.setOption(SPEC);
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
