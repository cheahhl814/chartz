<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chartz · GenomeTracks (template-native SVG)</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8f9fa; }
  .wrap { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 1.25rem; }
  h1 { font-size: 1rem; color: #333; margin: 0; font-weight: 600; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .dl-btn { font: inherit; font-size: 0.75rem; padding: 0.35rem 0.7rem; border: 1px solid #d0d4d9; border-radius: 6px; background: #fff; color: #333; cursor: pointer; flex-shrink: 0; }
  .dl-btn:hover { background: #f1f3f5; }
  #chart { width: 100%; }
  footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-head">
      <h1 id="chart-title"></h1>
      <button id="dl-png" class="dl-btn" type="button">Download PNG</button>
      <button id="dl-svg" class="dl-btn" type="button">Download SVG</button>
    </div>
    <div id="chart"></div>
  </div>
  <footer>chartz · GenomeTracks (engine 5) · template-native SVG, zero dependencies</footer>
</div>
<script>
const SPEC = {
  "title": "chr7:5,500,000-5,560,000 (hg38; ATAC-seq peaks + genes)",
  "region": {
    "chrom": "chr7",
    "start": 5500000,
    "end": 5560000
  },
  "tracks": [
    {
      "type": "peaks",
      "label": "ATAC peaks",
      "height": 30,
      "color": "#009E73",
      "items": [
        {
          "start": 5508000,
          "end": 5510400
        },
        {
          "start": 5524000,
          "end": 5526900,
          "label": "promoter"
        },
        {
          "start": 5541000,
          "end": 5543500
        },
        {
          "start": 5553000,
          "end": 5554600
        }
      ]
    },
    {
      "type": "genes",
      "label": "Genes (UCSC, merged)",
      "height": 60,
      "color": "#3C5488",
      "items": [
        {
          "name": "ATAC-T1",
          "strand": "+",
          "exons": [
            [
              5505000,
              5505800
            ],
            [
              5512000,
              5512900
            ],
            [
              5519000,
              5519800
            ]
          ]
        },
        {
          "name": "ATAC-T2",
          "strand": "-",
          "exons": [
            [
              5530000,
              5530900
            ],
            [
              5536500,
              5537400
            ],
            [
              5544000,
              5544900
            ],
            [
              5551000,
              5551800
            ]
          ]
        }
      ]
    }
  ]
};
document.getElementById('chart-title').textContent = SPEC.title || 'Genome tracks';

/* GenomeTracks renderer — template-native SVG, no external library.
   Spec: { title, region: {chrom, start, end},
           tracks: [ {type: "coverage"|"peaks"|"genes", label, height, color,
                      max?, bins?: [[pos, value]...], items?: [{start, end, label?, name?, strand?, exons?: [[s,e]...]}] } ] }
   Tracks render top-to-bottom in spec order (pyGenomeTracks convention);
   genes conventionally last. */
(function render() {
  const NS = "http://www.w3.org/2000/svg";
  const GUTTER = 150, PLOT_W = 820, AXIS_H = 34, GAP = 14, LABEL_GAP = 16;
  const {start, end} = SPEC.region;
  const px = p => GUTTER + ((p - start) / (end - start)) * PLOT_W;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${GUTTER + PLOT_W + 60} ${AXIS_H + SPEC.tracks.reduce((a, t) => a + LABEL_GAP + t.height + GAP, 10)}`);
  svg.setAttribute("style", "font-family: system-ui, sans-serif;");
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  };
  // x axis (top) — ticks with k/Mb formatting
  el("line", {x1: GUTTER, x2: GUTTER + PLOT_W, y1: AXIS_H - 8, y2: AXIS_H - 8, stroke: "#333"});
  const fmt = (v, span) => span < 1e6
    ? Math.round(v).toLocaleString("en-US")
    : (v / 1e6).toFixed(2) + " Mb";
  const NT = 6, SPAN = end - start;
  for (let i = 0; i <= NT; i++) {
    const p = Math.round(start + SPAN * i / NT);
    const x = px(p);
    el("line", {x1: x, x2: x, y1: AXIS_H - 12, y2: AXIS_H - 4, stroke: "#333"});
    el("text", {x, y: AXIS_H - 16, "text-anchor": "middle", "font-size": 10, fill: "#333"}, fmt(p, SPAN));
  }
  el("text", {x: GUTTER + PLOT_W + 6, y: AXIS_H - 8, "font-size": 10, fill: "#666"}, SPEC.region.chrom);
  // tracks, top to bottom in spec order
  let y = AXIS_H;
  for (const tr of SPEC.tracks) {
    const top = y + LABEL_GAP, bot = top + tr.height;
    el("text", {x: 6, y: top - 4, "font-size": 11, fill: "#444", "font-weight": 600}, tr.label);
    el("line", {x1: GUTTER, x2: GUTTER + PLOT_W, y1: bot, y2: bot, stroke: "#DDDDDD"});
    if (tr.type === "coverage") {
      const max = tr.max || Math.max(...tr.bins.map(b => b[1])) || 1;
      const pts = tr.bins.filter(b => b[0] >= start && b[0] <= end)
        .map(b => `${px(b[0]).toFixed(1)},${Math.max(top, bot - (b[1] / max) * tr.height).toFixed(1)}`);
      el("polygon", {points: `${GUTTER},${bot} ${pts.join(" ")} ${GUTTER + PLOT_W},${bot}`,
                     fill: tr.color, opacity: 0.75, stroke: "none"});
      el("text", {x: GUTTER + PLOT_W + 4, y: top + 8, "font-size": 10, fill: "#666"}, `max=${max}`);
    } else if (tr.type === "peaks") {
      for (const it of tr.items) {
        if (it.end < start || it.start > end) continue;
        el("rect", {x: px(Math.max(it.start, start)), y: top, width: Math.max(1, px(it.end) - px(it.start)),
                    height: tr.height, fill: tr.color, opacity: 0.8, rx: 2});
        if (it.label) el("text", {x: px(it.start) + 3, y: top + tr.height - 4, "font-size": 10, fill: "#fff"}, it.label);
      }
    } else if (tr.type === "genes") {
      const rows = tr.items.length, rowH = tr.height / rows;
      tr.items.forEach((g, i) => {
        const mid = top + rowH * i + rowH / 2;
        const exonTop = mid - rowH * 0.28, exonH = rowH * 0.56;
        const s = Math.max(...g.exons.map(e => e[0])), t = Math.min(...g.exons.map(e => e[1]));
        el("line", {x1: px(s), x2: px(t), y1: mid, y2: mid, stroke: tr.color || "#3C5488", "stroke-width": 1.5});
        for (const [a, b] of g.exons) {
          if (b < start || a > end) continue;
          el("rect", {x: px(a), y: exonTop, width: Math.max(1, px(b) - px(a)), height: exonH,
                      fill: tr.color || "#3C5488", stroke: "#000", "stroke-width": 0.4});
        }
        // strand arrowheads on the intron line
        const dir = g.strand === "-" ? -1 : 1;
        for (let k = 1; k <= 3; k++) {
          const ax = s + (t - s) * k / 4, w = 5 * dir;
          el("path", {d: `M ${px(ax) - w} ${mid - 3} L ${px(ax)} ${mid} L ${px(ax) - w} ${mid + 3} Z`,
                      fill: tr.color || "#3C5488"});
        }
        el("text", {x: px(s), y: top + rowH * i + 9, "font-size": 10, fill: "#222"}, g.name);
      });
    } else {
      el("text", {x: GUTTER + 6, y: top + tr.height / 2, "font-size": 11, fill: "#B00"},
         `unknown track type: ${tr.type}`);
    }
    y = bot + GAP;
  }
  document.getElementById("chart").appendChild(svg);
})();
/* ---- chartz print-export module (identical across template-native engines; v0.8.0) ----
   SPEC.export (optional, all keys optional):
     width_mm    - journal column width (e.g. 89 = Nature single column). With dpi, sets the
                   Download PNG raster deterministically: px = mm / 25.4 * dpi (default: 2x screen).
                   Download SVG then carries width/height in mm units (true print vector).
     dpi         - raster density for Download PNG (default 300).
     font_family - overrides the system-ui stack in both exports (journals: "Arial"). */
(function () {
  var getSvg = function () { return document.querySelector('#chart svg'); };
  var baseName = function () {
    return (document.getElementById('chart-title').textContent || 'chart').replace(/\s+/g, '_');
  };
  function exportScale(el) {
    var ex = (SPEC && SPEC.export) || {};
    var dpi = ex.dpi || 300;
    if (ex.width_mm) {
      var cssW = (el.viewBox.baseVal && el.viewBox.baseVal.width) || el.clientWidth || 900;
      return Math.max(1, (ex.width_mm / 25.4 * dpi) / cssW);
    }
    return 2;
  }
  function svgXml(print) {
    var el = getSvg();
    if (!el) return null;
    var vb = el.viewBox.baseVal;
    var w = (vb && vb.width) ? vb.width : el.clientWidth;
    var h = (vb && vb.height) ? vb.height : el.clientHeight;
    var clone = el.cloneNode(true);
    var ex = (SPEC && SPEC.export) || {};
    if (print && ex.width_mm) {
      clone.setAttribute('width', ex.width_mm + 'mm');
      clone.setAttribute('height', (h / w * ex.width_mm).toFixed(2) + 'mm');
    } else {
      clone.setAttribute('width', w);
      clone.setAttribute('height', h);
    }
    if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    if (!clone.getAttribute('xmlns:xlink')) clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    if (ex.font_family) clone.setAttribute('style', 'font-family: ' + ex.font_family + ';');
    return { xml: new XMLSerializer().serializeToString(clone), w: w, h: h };
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  document.getElementById('dl-svg').addEventListener('click', function () {
    var r = svgXml(true);
    if (!r) return;
    var prolog = '<?xml version="1.0" encoding="UTF-8"?>\n';
    download(new Blob([prolog + r.xml], { type: 'image/svg+xml;charset=utf-8' }), baseName() + '.svg');
  });
  document.getElementById('dl-png').addEventListener('click', function () {
    var r = svgXml(false);
    if (!r) return;
    var scale = exportScale(getSvg());
    var url = URL.createObjectURL(new Blob([r.xml], { type: 'image/svg+xml;charset=utf-8' }));
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(r.w * scale);
      canvas.height = Math.round(r.h * scale);
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) { download(blob, baseName() + '.png'); });
    };
    img.src = url;
  });
})();
</script>
</body>
</html>
