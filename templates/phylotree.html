<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chartz · PhyloTree 1 (template-native)</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8f9fa; }
  .wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 1.25rem; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .card-head h1 { font-size: 1.1rem; margin: 0 0 .75rem 0; color: #333; }
  .dl-btn { font-size: .8rem; padding: .35rem .7rem; border: 1px solid #dee2e6; border-radius: 6px;
            background: #fff; cursor: pointer; white-space: nowrap; }
  .dl-btn:hover { background: #f1f3f5; }
  #chart { width: 100%; display: flex; justify-content: center; }
  footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-head">
      <h1 id="chart-title"></h1>
      <div>
        <button id="dl-svg" class="dl-btn" type="button">Download SVG</button>
        <button id="dl-png" class="dl-btn" type="button">Download PNG</button>
      </div>
    </div>
    <div id="chart"></div>
  </div>
  <footer>chartz · PhyloTree (engine 13) · template-native SVG, zero dependencies</footer>
</div>
<script>
const SPEC = /*__SPEC__*/;
document.getElementById('chart-title').textContent = SPEC.title || 'Phylogenetic tree';
(function render() {
  // ================= inputs =================
  if (!SPEC.newick) throw new Error('phylotree: SPEC.newick is required');
  var lay  = SPEC.layout || {};
  var mode = lay.mode || 'rect';                    // rect | circular
  var style = lay.style || 'phylogram';             // phylogram | cladogram
  var bs   = Object.assign({ display: true, min_size: 2, max_size: 7, show_values: false, threshold: 0 }, SPEC.bootstrap || {});
  var sb   = SPEC.scale_bar !== false ? Object.assign({ label: 'substitutions/site' }, (typeof SPEC.scale_bar === 'object' ? SPEC.scale_bar : {})) : null;
  var ranges = SPEC.ranges || [];                   // [{tips: [...], color, label?}]
  var tl   = Object.assign({ show: true, font_size: 11, italic: false }, SPEC.tip_labels || {});

  // ================= Newick parser =================
  // simplified single-pass: reuse parseNode from a fresh index
  function newick(src) {
    var s = src.trim().replace(/;\s*$/, '');
    var i = 0;
    function parse() {
      skipWs();
      if (s[i] === '(') {
        i++;
        var n = { children: [], name: null, support: null, length: 0 };
        for (;;) {
          skipWs();
          n.children.push(parse());
          skipWs();
          if (s[i] === ',') { i++; continue; }
          if (s[i] === ')') { i++; break; }
          throw new Error('Newick: expected "," or ")" at position ' + i);
        }
        var lbl = readTok();
        if (lbl) {
          if (/^[\d.]+$/.test(lbl)) n.support = parseFloat(lbl); else n.name = lbl;
        }
      } else {
        var nm = readTok();
        if (!nm) throw new Error('Newick: expected tip label at position ' + i);
        n = { children: [], name: nm, support: null, length: 0 };
      }
      skipWs();
      if (s[i] === ':') {
        i++;
        var tok = readTok();
        var L = parseFloat(tok);
        if (isNaN(L)) throw new Error('Newick: bad branch length "' + tok + '"');
        n.length = L;
      }
      return n;
    }
    function skipWs() { while (i < s.length && /\s/.test(s[i])) i++; }
    function readTok() {
      skipWs(); var start = i;
      while (i < s.length && ',():;'.indexOf(s[i]) < 0) i++;
      return s.slice(start, i).trim();
    }
    var root = parse();
    if (i < s.length) throw new Error('Newick: unexpected trailing characters at position ' + i);
    return root;
  }
  var tree = newick(SPEC.newick);

  // flatten: depth, cumulative length, leaf order
  var nodesList = [];
  (function walk(n, parent, cum) {
    n._depth = parent ? parent._depth + 1 : 0;
    n._cum = (style === 'phylogram') ? cum + n.length : n._depth;   // cladogram: unit depth
    n._parent = parent;
    nodesList.push(n);
    n.children.forEach(function (c) { walk(c, n, n._cum); });
  })(tree, null, 0);
  var leaves = nodesList.filter(function (n) { return !n.children.length; });
  if (leaves.length < 2) throw new Error('phylotree: need >= 2 leaves');
  var totalLen = Math.max.apply(null, leaves.map(function (n) { return n._cum; })) || 1;

  // ================= geometry =================
  var W = lay.width || 1100, H = lay.height || 720;
  var M = { l: 30, r: 200, t: 40, b: 60 };          // r reserves tip-label space (rect)
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('style', 'font-family: system-ui, sans-serif;');
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e); return e;
  }
  function fmt(v) { return (Math.round(v * 1000) / 1000).toString(); }

  if (mode === 'rect') {
    var plotW = W - M.l - M.r, plotH = H - M.t - M.b;
    var yStep = plotH / leaves.length;
    leaves.forEach(function (n, k) { n._y = M.t + (k + 0.5) * yStep; });
    (function setY(n) {
      if (n.children.length) {
        n.children.forEach(setY);
        n._y = (n.children[0]._y + n.children[n.children.length - 1]._y) / 2;
      }
    })(tree);
    var xScale = plotW / totalLen;
    nodesList.forEach(function (n) { n._x = M.l + n._cum * xScale; });

    // edges: vertical spine at parent + horizontal per child
    nodesList.forEach(function (n) {
      if (!n.children.length) return;
      var ys = n.children.map(function (c) { return c._y; });
      el('line', { x1: n._x, y1: Math.min.apply(null, ys), x2: n._x, y2: Math.max.apply(null, ys),
                   stroke: '#333', 'stroke-width': 1.2 });
      n.children.forEach(function (c) {
        el('line', { x1: n._x, y1: c._y, x2: c._x, y2: c._y, stroke: '#333', 'stroke-width': 1.2 });
      });
    });
    // bootstrap circles
    if (bs.display) {
      nodesList.forEach(function (n) {
        if (!n.children.length || n.support == null || n.support < bs.threshold) return;
        var r = bs.min_size + (n.support / 100) * (bs.max_size - bs.min_size);
        var c = el('circle', { cx: n._x, cy: n._y, r: r, fill: '#1f77b4', 'fill-opacity': 0.85 });
        var t = document.createElementNS(NS, 'title'); t.textContent = 'support ' + n.support; c.appendChild(t);
        if (bs.show_values) el('text', { x: n._x, y: n._y - r - 3, 'text-anchor': 'middle',
          'font-size': 9, fill: '#1f77b4' }).textContent = fmt(n.support);
      });
    }
    // clade ranges (band in a lane left of the tree, spanning member-leaf extent)
    var rangeLane = 14, rx = M.l - 18;
    ranges.forEach(function (r) {
      var ys = r.tips.map(function (name) {
        var leaf = leaves.filter(function (l) { return l.name === name; })[0];
        if (!leaf) throw new Error('phylotree: range tip "' + name + '" not found');
        return leaf._y;
      });
      var y0 = Math.min.apply(null, ys) - yStep * 0.4, y1 = Math.max.apply(null, ys) + yStep * 0.4;
      el('rect', { x: rx - rangeLane, y: y0, width: rangeLane, height: y1 - y0,
                   fill: r.color, rx: 4, 'fill-opacity': 0.9 });
    });
    // tip labels
    if (tl.show) {
      leaves.forEach(function (n) {
        var t = el('text', { x: n._x + 6, y: n._y + 4, 'font-size': tl.font_size,
          fill: '#222', 'text-anchor': 'start' });
        t.textContent = n.name;
        if (tl.italic) t.setAttribute('font-style', 'italic');
      });
    }
    // scale bar
    if (sb) {
      var nice = Math.pow(10, Math.floor(Math.log10(totalLen / 5)));
      var cands = [1, 2, 5, 10].map(function (m) { return m * nice; });
      var barLen = cands.filter(function (v) { return v <= totalLen / 2; }).pop() || cands[0];
      var bx = M.l, by = H - 18;
      el('line', { x1: bx, y1: by, x2: bx + barLen * xScale, y2: by, stroke: '#333', 'stroke-width': 2 });
      el('line', { x1: bx, y1: by - 4, x2: bx, y2: by + 2, stroke: '#333', 'stroke-width': 1.5 });
      el('line', { x1: bx + barLen * xScale, y1: by - 2, x2: bx + barLen * xScale, y2: by + 2, stroke: '#333', 'stroke-width': 1.5 });
      var lbl = el('text', { x: bx + barLen * xScale / 2, y: by - 8, 'text-anchor': 'middle', 'font-size': 11, fill: '#555' });
      lbl.textContent = fmt(barLen) + ' ' + (sb.label || 'substitutions/site');
    }
  } else if (mode === 'circular') {
    var CX = W / 2 - 40, CY = H / 2, RMAX = Math.min(W / 2 - 220, H / 2 - 50);
    var R0 = 30;
    var unit = 360 / leaves.length, leafIdx = 0;
    (function assign(n) {
      if (!n.children.length) { n._ang = -90 + (leafIdx++ + 0.5) * unit; return; }
      n.children.forEach(assign);
      var a0 = n.children[0]._ang, a1 = n.children[n.children.length - 1]._ang;
      if (a1 < a0) a1 += 360;
      n._ang = a0 + (a1 - a0) / 2;
    })(tree);
    var rScale = RMAX / totalLen;
    nodesList.forEach(function (n) { n._r = R0 + n._cum * rScale; });
    function pt(n) {
      var th = n._ang * Math.PI / 180;
      return { x: CX + n._r * Math.cos(th), y: CY + n._r * Math.sin(th), th: n._ang };
    }
    nodesList.forEach(function (n) {
      if (!n.children.length) return;
      var p = pt(n);
      n.children.forEach(function (c) {
        var q = pt(c);
        // radial segment at parent's angle, then arc at child radius (c._r)
        var th = p.th * Math.PI / 180;
        var jx = CX + c._r * Math.cos(th), jy = CY + c._r * Math.sin(th);
        el('path', { d: 'M ' + p.x + ' ' + p.y + ' L ' + jx + ' ' + jy +
          ' A ' + c._r + ' ' + c._r + ' 0 0 ' + (q.th > p.th ? 1 : 0) + ' ' + q.x + ' ' + q.y,
          fill: 'none', stroke: '#333', 'stroke-width': 1.2 });
      });
    });
    if (bs.display) {
      nodesList.forEach(function (n) {
        if (!n.children.length || n.support == null || n.support < bs.threshold) return;
        var p = pt(n);
        var r = bs.min_size + (n.support / 100) * (bs.max_size - bs.min_size);
        var c = el('circle', { cx: p.x, cy: p.y, r: r, fill: '#1f77b4', 'fill-opacity': 0.85 });
        var t = document.createElementNS(NS, 'title'); t.textContent = 'support ' + n.support; c.appendChild(t);
      });
    }
    // ranges: annular sectors spanning member leaves
    ranges.forEach(function (r) {
      var angs = r.tips.map(function (name) {
        var leaf = leaves.filter(function (l) { return l.name === name; })[0];
        if (!leaf) throw new Error('phylotree: range tip "' + name + '" not found');
        return leaf._ang;
      });
      var a0 = Math.min.apply(null, angs) - unit * 0.4, a1 = Math.max.apply(null, angs) + unit * 0.4;
      var rr = RMAX + 18;
      var x0 = CX + rr * Math.cos(a0 * Math.PI / 180), y0 = CY + rr * Math.sin(a0 * Math.PI / 180);
      var x1 = CX + rr * Math.cos(a1 * Math.PI / 180), y1 = CY + rr * Math.sin(a1 * Math.PI / 180);
      el('path', { d: 'M ' + x0 + ' ' + y0 + ' A ' + rr + ' ' + rr + ' 0 0 1 ' + x1 + ' ' + y1,
        fill: 'none', stroke: r.color, 'stroke-width': 12, 'stroke-opacity': 0.9, 'stroke-linecap': 'butt' });
    });
    // tip labels (rotated outward)
    if (tl.show) {
      leaves.forEach(function (n) {
        var p = pt(n);
        var right = Math.cos(p.th * Math.PI / 180) >= 0;
        var t = el('text', { x: p.x + (right ? 6 : -6), y: p.y + 4,
          'text-anchor': right ? 'start' : 'end', 'font-size': tl.font_size, fill: '#222' });
        t.textContent = n.name;
        if (tl.italic) t.setAttribute('font-style', 'italic');
      });
    }
    if (sb) {
      var nice = Math.pow(10, Math.floor(Math.log10(totalLen / 2)));
      var cands2 = [1, 2, 5, 10].map(function (m) { return m * nice; });
      var barLen2 = cands2.filter(function (v) { return v <= totalLen / 2; }).pop() || cands2[0];
      var a2 = -90, r1 = RMAX + 45, r2 = RMAX + 45 + barLen2 * rScale;
      var p1x = CX + r1 * Math.cos(a2 * Math.PI / 180), p1y = CY + r1 * Math.sin(a2 * Math.PI / 180);
      var p2x = CX + r2 * Math.cos(a2 * Math.PI / 180), p2y = CY + r2 * Math.sin(a2 * Math.PI / 180);
      el('line', { x1: p1x, y1: p1y, x2: p2x, y2: p2y, stroke: '#333', 'stroke-width': 2 });
      var lt = el('text', { x: (p1x + p2x) / 2, y: p1y - 8, 'text-anchor': 'middle', 'font-size': 11, fill: '#555' });
      lt.textContent = fmt(barLen2) + ' ' + (sb.label || 'substitutions/site');
    }
  } else {
    throw new Error('phylotree: layout.mode must be "rect" or "circular"');
  }

  // range legend (both layouts)
  if (ranges.length && (SPEC.legend === undefined || SPEC.legend)) {
    var lx = 24, ly = 24;
    ranges.forEach(function (r, k) {
      el('rect', { x: lx, y: ly + k * 20, width: 12, height: 12, fill: r.color, rx: 2 });
      var t = el('text', { x: lx + 18, y: ly + k * 20 + 10, 'font-size': 11, fill: '#333' });
      t.textContent = r.label || r.tips.join(', ');
    });
  }
  document.getElementById('chart').appendChild(svg);
  var bb = svg.getBBox();
  svg.setAttribute('viewBox', (bb.x - 12) + ' ' + (bb.y - 12) + ' ' + (bb.width + 24) + ' ' + (bb.height + 24));
})();
</script>
<script>
/* ---- chartz print-export module (identical across template-native engines; v0.8.0) ----
   SPEC.export (optional, all keys optional):
     width_mm    - journal column width (e.g. 89 = Nature single column). With dpi, sets the
                   Download PNG raster deterministically: px = mm / 25.4 * dpi (default: 2x screen).
                   Download SVG then carries width/height in mm units (true print vector).
     dpi         - raster density for Download PNG (default 300).
     font_family - overrides the system-ui stack in both exports (journals: "Arial"). */
(function () {
  var getSvg = function () { return document.querySelector('#chart svg'); };
  var baseName = function () {
    return (document.getElementById('chart-title').textContent || 'chart').replace(/\s+/g, '_');
  };
  function exportScale(el) {
    var ex = (SPEC && SPEC.export) || {};
    var dpi = ex.dpi || 300;
    if (ex.width_mm) {
      var cssW = (el.viewBox.baseVal && el.viewBox.baseVal.width) || el.clientWidth || 900;
      return Math.max(1, (ex.width_mm / 25.4 * dpi) / cssW);
    }
    return 2;
  }
  function svgXml(print) {
    var el = getSvg();
    if (!el) return null;
    var vb = el.viewBox.baseVal;
    var w = (vb && vb.width) ? vb.width : el.clientWidth;
    var h = (vb && vb.height) ? vb.height : el.clientHeight;
    var clone = el.cloneNode(true);
    var ex = (SPEC && SPEC.export) || {};
    if (print && ex.width_mm) {
      clone.setAttribute('width', ex.width_mm + 'mm');
      clone.setAttribute('height', (h / w * ex.width_mm).toFixed(2) + 'mm');
    } else {
      clone.setAttribute('width', w);
      clone.setAttribute('height', h);
    }
    if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    if (!clone.getAttribute('xmlns:xlink')) clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    if (ex.font_family) clone.setAttribute('style', 'font-family: ' + ex.font_family + ';');
    return { xml: new XMLSerializer().serializeToString(clone), w: w, h: h };
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  document.getElementById('dl-svg').addEventListener('click', function () {
    var r = svgXml(true);
    if (!r) return;
    var prolog = '<?xml version="1.0" encoding="UTF-8"?>\n';
    download(new Blob([prolog + r.xml], { type: 'image/svg+xml;charset=utf-8' }), baseName() + '.svg');
  });
  document.getElementById('dl-png').addEventListener('click', function () {
    var r = svgXml(false);
    if (!r) return;
    var scale = exportScale(getSvg());
    var url = URL.createObjectURL(new Blob([r.xml], { type: 'image/svg+xml;charset=utf-8' }));
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(r.w * scale);
      canvas.height = Math.round(r.h * scale);
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) { download(blob, baseName() + '.png'); });
    };
    img.src = url;
  });
})();
</script>
</body>
</html>
