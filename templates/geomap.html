<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chartz · GeoMap (template-native SVG + d3-geo)</title>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8f9fa; }
  .wrap { max-width: 1040px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 1.25rem; }
  h1 { font-size: 1rem; color: #333; margin: 0; font-weight: 600; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .dl-btn { font: inherit; font-size: 0.75rem; padding: 0.35rem 0.7rem; border: 1px solid #d0d4d9; border-radius: 6px; background: #fff; color: #333; cursor: pointer; flex-shrink: 0; }
  .dl-btn:hover { background: #f1f3f5; }
  #chart { width: 100%; }
  footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-head">
      <h1 id="chart-title"></h1>
      <button id="dl-png" class="dl-btn" type="button">Download PNG</button>
      <button id="dl-svg" class="dl-btn" type="button">Download SVG</button>
    </div>
    <div id="chart"></div>
  </div>
  <footer>chartz · GeoMap (engine 15) · d3-geo projections, GeoJSON embedded in spec · self-contained</footer>
</div>
<script>
const SPEC = /*__SPEC__*/;
document.getElementById('chart-title').textContent = SPEC.title || 'Map';
if (SPEC.subtitle) {
  const sub = document.createElement('div');
  sub.style.cssText = 'font-size:0.8rem;color:#777;margin:-0.6rem 0 0.8rem;';
  sub.textContent = SPEC.subtitle;
  document.getElementById('chart').parentNode.insertBefore(sub, document.getElementById('chart'));
}

/* GeoMap renderer — d3-geo projection + GeoJSON embedded in the SPEC.
   Spec: { title, subtitle?, width?, height?, projection?: "mercator"|"equirectangular",
           bbox?: {lon_min, lat_min, lon_max, lat_max},        // default: fit to all data
           basemap?: { land?: <FeatureCollection>, land_fill?, land_stroke?, land_stroke_width?, ocean_color?,
                       graticule?: true|{stroke?, stroke_width?, step?: [lon,lat], labels?: bool, label_color?} },
           layers?: [ {type: "polygons"|"lines", label?, features: <FC|Feature|geometry>, fill?, fill_opacity?,
                       stroke?, stroke_width?, dash?}
                    | {type: "points", label?, legend_title?, legend_rows?: "items",
                       items: [{lon, lat, label?, color?, size?, shape?, stroke?, stroke_width?, label_side?, italic?}] } ],
           annotations?: [{lon, lat, text, color?, size?, italic?, anchor?}],   // free place-name labels
           shape_key?: {title?, items: [{shape, fill?, stroke?, size?, label}]}, // 2nd legend section
           scale_bar?: true|{length_km?}|false, north_arrow?: true, legend?: true,
           export?: { width_mm?, dpi?, font_family? } }
   Marker shapes: "circle" (default) | "diamond" | "square" | "triangle" — encode a second
   categorical variable (e.g. colour = species, shape = data source) publication-style.
   Reference-map preset: basemap {land_fill:"#f0f0f0", land_stroke:"#888888", land_stroke_width:0.3,
   ocean_color:"#e6f0fa", graticule:true} + annotations for place names. */
(function render() {
  const NS = "http://www.w3.org/2000/svg";
  const grat = SPEC.basemap && SPEC.basemap.graticule;
  const W = SPEC.width || 900, H = SPEC.height || 700, PAD = grat ? 42 : 34;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("style", "font-family: system-ui, sans-serif; display: block; margin: 0 auto; max-width: 100%;");
  const el = (tag, attrs, parent, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    (parent || svg).appendChild(n);
    return n;
  };
  const fc = g => Array.isArray(g) ? {type: "FeatureCollection",
        features: g.map(x => typeof x === "object" && x.type === "Feature" ? x : {type: "Feature", properties: {}, geometry: x})}
      : (g.type === "FeatureCollection" ? g : {type: "FeatureCollection",
        features: [g.type === "Feature" ? g : {type: "Feature", properties: {}, geometry: g}]});
  // d3 treats polygons as SPHERICAL and picks the interior by winding: exterior rings
  // must be CLOCKWISE (holes counterclockwise) — the OPPOSITE of the GeoJSON RFC.
  // A counterclockwise ring fills its planar complement (the rest of the world).
  // Normalize: exterior shoelace area ≤ 0 (clockwise in lon/lat plane), holes ≥ 0.
  const signedArea = ring => ring.reduce((s, p, i) => {
    const q = ring[(i + 1) % ring.length];
    return s + (p[0] * q[1] - q[0] * p[1]);
  }, 0) / 2;
  const fixPolygon = poly => poly.map((ring, ri) => {
    const a = signedArea(ring);
    return (ri === 0 ? a > 0 : a < 0) ? [...ring].reverse() : ring;
  });
  const fixWinding = geo => {
    if (geo.type === "Polygon") return {...geo, coordinates: fixPolygon(geo.coordinates)};
    if (geo.type === "MultiPolygon")
      return {...geo, coordinates: geo.coordinates.map(fixPolygon)};
    return geo;
  };
  // point glyph outlines for the non-circle marker shapes (second categorical encoding)
  const shapeGlyph = (shape, cx, cy, s) => {
    if (shape === "square") return `M ${cx - s} ${cy - s} H ${cx + s} V ${cy + s} H ${cx - s} Z`;
    if (shape === "diamond") return `M ${cx} ${cy - 1.25 * s} L ${cx + 1.25 * s} ${cy} L ${cx} ${cy + 1.25 * s} L ${cx - 1.25 * s} ${cy} Z`;
    if (shape === "triangle") return `M ${cx} ${cy - 1.2 * s} L ${cx + 1.15 * s} ${cy + 0.9 * s} L ${cx - 1.15 * s} ${cy + 0.9 * s} Z`;
    return null;
  };
  const fmtLon = d => Math.round(d * 1e6) / 1e6 === 0 ? "0°"
      : `${Math.abs(Math.round(d * 1e6) / 1e6)}°${d < 0 ? "W" : "E"}`;
  const fmtLat = d => Math.round(d * 1e6) / 1e6 === 0 ? "0°"
      : `${Math.abs(Math.round(d * 1e6) / 1e6)}°${d < 0 ? "S" : "N"}`;
  const allLayers = (SPEC.layers || []);
  const everything = {type: "FeatureCollection", features: []};
  if (SPEC.basemap && SPEC.basemap.land) everything.features.push(...fc(SPEC.basemap.land).features);
  for (const L of allLayers || []) {
    if (L.type === "polygons" || L.type === "lines") everything.features.push(...fc(L.features).features);
    if (L.type === "points") for (const p of L.items)
      everything.features.push({type: "Feature", properties: {}, geometry: {type: "Point", coordinates: [p.lon, p.lat]}});
  }
  const projType = (SPEC.projection || "mercator").toLowerCase();
  const proj = projType === "equirectangular" ? d3.geoEquirectangular() : d3.geoMercator();
  // extent: with a raster basemap the projection MUST fit the raster bbox (alignment);
  // otherwise explicit bbox, else fit to all content
  const rasterBbox = SPEC.basemap && SPEC.basemap.raster && SPEC.basemap.raster.bbox;
  const fitTo = rasterBbox
    ? {type: "MultiPoint", coordinates: [[rasterBbox.lon_min, rasterBbox.lat_min],
                                         [rasterBbox.lon_max, rasterBbox.lat_max]]}
    : SPEC.bbox
      ? {type: "MultiPoint", coordinates: [[SPEC.bbox.lon_min, SPEC.bbox.lat_min],
                                           [SPEC.bbox.lon_max, SPEC.bbox.lat_max]]}
      : everything;
  proj.fitExtent([[PAD, PAD], [W - PAD, H - PAD]], fitTo);
  const path = d3.geoPath(proj);
  const clipId = "mapclip";
  const defs = el("defs");
  const cp = el("clipPath", {id: clipId}, defs);
  el("rect", {x: PAD - 1, y: PAD - 1, width: W - 2 * PAD + 2, height: H - 2 * PAD + 2}, cp);
  // ocean background
  el("rect", {x: PAD - 1, y: PAD - 1, width: W - 2 * PAD + 2, height: H - 2 * PAD + 2,
              fill: (SPEC.basemap && SPEC.basemap.ocean_color) || "#cfe3f0"});
  const mapG = el("g", {"clip-path": `url(#${clipId})`});
  // raster tile basemap (optional, embedded data-URI PNG in web-mercator space).
  // When present it replaces the ocean/land underlay; the vector projection is
  // fit to the raster bbox so overlays align pixel-perfectly.
  if (SPEC.basemap && SPEC.basemap.raster && SPEC.basemap.raster.data) {
    const rb = SPEC.basemap.raster.bbox;
    const img = el("image", {x: PAD - 1, y: PAD - 1,
                             width: W - 2 * PAD + 2, height: H - 2 * PAD + 2,
                             preserveAspectRatio: "none"}, mapG);
    img.setAttributeNS("http://www.w3.org/1999/xlink", "href", SPEC.basemap.raster.data);
    img.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", SPEC.basemap.raster.data);
    if (SPEC.basemap.raster.attribution)
      el("text", {x: W - PAD - 6, y: H - PAD - 6, "font-size": 9, fill: "#333",
                  "text-anchor": "end", opacity: 0.85}, mapG, SPEC.basemap.raster.attribution);
  }
  // graticule (optional) — drawn AFTER land as white hairlines over the map (the journal
  // reference-map look), with degree-formatted tick labels outside the frame.
  // true | {stroke?, stroke_width?, step?: [lon,lat], labels?: bool, label_color?}
  if (grat) {
    const g = grat === true ? {} : grat;
    const gStroke = g.stroke || "#ffffff", gW = g.stroke_width == null ? 0.7 : g.stroke_width;
    let bb = rasterBbox || SPEC.bbox;
    if (!bb) {
      const a = proj.invert([PAD, PAD]), b2 = proj.invert([W - PAD, H - PAD]);
      bb = {lon_min: a[0], lat_min: b2[1], lon_max: b2[0], lat_max: a[1]};
    }
    const pick = s => [0.5, 1, 2, 5, 10, 15, 20, 30, 45, 60].reduce((p, c) =>
      Math.abs(c - s / 5) < Math.abs(p - s / 5) ? c : p);
    const st = g.step || [pick(bb.lon_max - bb.lon_min), pick(bb.lat_max - bb.lat_min)];
    const ticks = (min, max, stepv) => {
      const out = [];
      for (let v = Math.ceil(min / stepv) * stepv; v <= max + 1e-9; v += stepv)
        out.push(Math.round(v * 1e6) / 1e6);
      return out;
    };
    const lons = ticks(bb.lon_min, bb.lon_max, st[0]);
    const lats = ticks(bb.lat_min, bb.lat_max, st[1]);
    for (const lo of lons) {
      const a = proj([lo, Math.max(-85, bb.lat_min)]), b2 = proj([lo, Math.min(85, bb.lat_max)]);
      if (a && b2) el("path", {d: `M ${a[0]} ${a[1]} L ${b2[0]} ${b2[1]}`, stroke: gStroke,
                               "stroke-width": gW, fill: "none"}, mapG);
    }
    for (const la of lats) {
      const a = proj([bb.lon_min, la]), b2 = proj([bb.lon_max, la]);
      if (a && b2) el("path", {d: `M ${a[0]} ${a[1]} L ${b2[0]} ${b2[1]}`, stroke: gStroke,
                               "stroke-width": gW, fill: "none"}, mapG);
    }
    if (g.labels !== false) {
      const lc = g.label_color || "#555";
      for (const lo of lons) {
        const x = proj([lo, 0])[0];
        el("text", {x, y: H - PAD + 15, "font-size": 9.5, fill: lc, "text-anchor": "middle"}, svg,
           fmtLon(lo));
      }
      for (const la of lats) {
        const y = proj([0, la])[1];
        el("text", {x: PAD - 7, y: y + 3, "font-size": 9.5, fill: lc, "text-anchor": "end"}, svg,
           fmtLat(la));
      }
    }
  }
  // land — one path PER FEATURE: combining features into a single evenodd path would
  // XOR out overlapping regions (e.g. an OSM island inside a coarser Natural Earth
  // mainland polygon renders as water). Per-feature paths stack safely; evenodd still
  // honours holes WITHIN one feature (rings 2..n of a Polygon).
  if (SPEC.basemap && SPEC.basemap.land) {
    const lf = SPEC.basemap.land_fill || "#e8e4d8",
          ls = SPEC.basemap.land_stroke || "#8a8a7a",
          lsw = SPEC.basemap.land_stroke_width || 0.8;
    for (const f of fc(SPEC.basemap.land).features) {
      el("path", {d: path({...f, geometry: fixWinding(f.geometry)}), fill: lf, stroke: ls,
                  "stroke-width": lsw, "fill-rule": "evenodd"}, mapG);
    }
  }
  // data layers, in spec order (polygons/lines under points)
  const legendRows = [];
  for (const L of allLayers) {
    if (L.type === "polygons") {
      for (const f of fc(L.features).features) {
        el("path", {d: path({...f, geometry: fixWinding(f.geometry)}), fill: L.fill || "#7fbf7b",
                    "fill-opacity": L.fill_opacity == null ? 0.5 : L.fill_opacity,
                    stroke: L.stroke || "none", "stroke-width": L.stroke_width || 0,
                    "fill-rule": "evenodd"}, mapG);
      }
      if (L.label) legendRows.push({kind: "poly", label: L.label, fill: L.fill || "#7fbf7b", stroke: L.stroke || "none"});
    } else if (L.type === "lines") {
      el("path", {d: path(fc(L.features)), fill: "none",
                  stroke: L.stroke || "#4477aa", "stroke-width": L.width || 2,
                  "stroke-dasharray": L.dash || "none",
                  "stroke-linecap": "round", "stroke-linejoin": "round"}, mapG);
      if (L.label) legendRows.push({kind: "line", label: L.label, stroke: L.stroke || "#4477aa", dash: L.dash});
    }
  }
  for (const L of allLayers) {
    if (L.type !== "points") continue;
    for (const p of L.items || []) {
      const q = proj([p.lon, p.lat]); if (!q) continue;
      const s = p.size || 7, shp = p.shape || "circle";
      const fill = p.color || (L.color || "#E15759");
      const stroke = p.stroke == null ? "#fff" : p.stroke;
      const sw = p.stroke_width == null ? 1.5 : p.stroke_width;
      const glyph = shapeGlyph(shp, q[0], q[1], s);
      if (glyph) el("path", {d: glyph, fill, stroke, "stroke-width": sw,
                             "stroke-linejoin": "miter"}, mapG);
      else el("circle", {cx: q[0], cy: q[1], r: s, fill, stroke, "stroke-width": sw}, mapG);
      if (p.label) {
        const side = p.label_side || "right";
        const dx = side === "left" ? -s - 5 : (side === "top" || side === "bottom") ? 0 : s + 5;
        const dy = side === "top" ? -(s) - 5 : side === "bottom" ? s + 13 : 4;
        el("text", {x: q[0] + dx, y: q[1] + dy, "font-size": 11.5, fill: "#222",
                    "font-style": p.italic ? "italic" : "normal",
                    "text-anchor": side === "left" ? "end" : side === "top" || side === "bottom" ? "middle" : "start",
                    "paint-order": "stroke", stroke: "rgba(255,255,255,0.85)", "stroke-width": 3}, mapG, p.label);
      }
    }
    if (L.legend_rows === "items") {
      // one legend row PER ITEM (e.g. each species its own coloured glyph)
      for (const p of L.items || [])
        if (p.label) legendRows.push({kind: "point", label: p.label, fill: p.color || L.color || "#E15759",
                                      shape: p.shape || "circle", stroke: p.stroke == null ? "#fff" : p.stroke,
                                      size: Math.min(p.size || 7, 7), italic: p.italic});
    } else if (L.label) {
      legendRows.push({kind: "point", label: L.label,
                       fill: (L.items[0] && L.items[0].color) || L.color || "#E15759",
                       shape: L.legend_shape || (L.items[0] && L.items[0].shape) || "circle",
                       stroke: (L.items[0] && L.items[0].stroke == null) ? "#fff" : L.items[0].stroke,
                       italic: L.italic, group: L.group});
    }
  }
  // shape key — a SECOND legend section for the shape encoding (e.g. marker shape = data source)
  if (SPEC.shape_key && SPEC.shape_key.items)
    for (const k of SPEC.shape_key.items)
      legendRows.push({kind: "point", group: SPEC.shape_key.title || "", label: k.label,
                       fill: k.fill == null ? "#fff" : k.fill, stroke: k.stroke == null ? "#222" : k.stroke,
                       shape: k.shape || "circle", size: Math.min(k.size || 7, 7)});
  // scale bar — km per pixel at map-centre latitude (mercator/equirectangular horizontal scale)
  if (SPEC.scale_bar) {
    const lat0 = SPEC.bbox ? (SPEC.bbox.lat_min + SPEC.bbox.lat_max) / 2 : 0;
    const a = proj([0, lat0]), b = proj([1, lat0]);
    const degPx = Math.abs(b[0] - a[0]);
    const kmPerDeg = 111.32 * Math.cos(lat0 * Math.PI / 180);
    const kmPerPx = kmPerDeg / degPx;
    const wantKm = ((W - 2 * PAD) * kmPerPx) / 5;
    const pow = Math.pow(10, Math.floor(Math.log10(wantKm)));
    let nice = [1, 2, 5, 10].map(m => m * pow).reduce((p, c) => Math.abs(c - wantKm) < Math.abs(p - wantKm) ? c : p);
    if (SPEC.scale_bar && SPEC.scale_bar.length_km) nice = SPEC.scale_bar.length_km;
    const px = nice / kmPerPx;
    const bx = PAD + 10, by = H - PAD - 12;
    el("line", {x1: bx, x2: bx + px, y1: by, y2: by, stroke: "#222", "stroke-width": 2}, mapG);
    el("line", {x1: bx, x2: bx, y1: by - 4, y2: by + 4, stroke: "#222", "stroke-width": 2}, mapG);
    el("line", {x1: bx + px, x2: bx + px, y1: by - 4, y2: by + 4, stroke: "#222", "stroke-width": 2}, mapG);
    el("text", {x: bx + px / 2, y: by - 6, "font-size": 10.5, fill: "#222", "text-anchor": "middle",
                "paint-order": "stroke", stroke: "rgba(255,255,255,0.85)", "stroke-width": 3},
       mapG, nice >= 1 ? `${nice} km` : `${Math.round(nice * 1000)} m`);
  }
  // north arrow — top-right
  if (SPEC.north_arrow !== false) {
    const nx = W - PAD - 18, ny = PAD + 14;
    const halo = {"paint-order": "stroke", stroke: "rgba(255,255,255,0.9)", "stroke-width": 3};
    el("line", {...{"x1": nx, "x2": nx, "y1": ny + 8, "y2": ny + 28, stroke: "#222", "stroke-width": 1.5}, ...halo}, mapG);
    el("path", {d: `M ${nx} ${ny} L ${nx - 4.5} ${ny + 11} L ${nx} ${ny + 8} L ${nx + 4.5} ${ny + 11} Z`,
                fill: "#222", ...halo}, mapG);
    el("text", {x: nx, y: ny + 40, "font-size": 11, fill: "#222", "text-anchor": "middle",
                "font-weight": 600, ...halo}, mapG, "N");
  }
  // legend — bottom-right; rows may carry `group` titles (grouped/sectioned legend:
  // e.g. "Species" block of coloured glyphs, then a "Data source" shape-key block)
  if (SPEC.legend !== false && legendRows.length) {
    const rows = [];
    let lastGroup = null;
    for (const r of legendRows) {
      if (r.group != null && r.group !== lastGroup) { rows.push({header: r.group}); lastGroup = r.group; }
      else if (r.group == null) lastGroup = null;
      rows.push(r);
    }
    const lw = Math.max(...rows.map(r => ((r.header || r.label || "")).length)) * 6.3 + 46;
    const lh = rows.length * 17 + 12 + rows.filter(r => r.header !== undefined).length * 6;
    const lx = W - PAD - lw - 8, ly = H - PAD - 12 - 14 - lh;
    el("rect", {x: lx, y: ly, width: lw, height: lh, rx: 5, fill: "rgba(255,255,255,0.92)",
                stroke: "#c8cdd3", "stroke-width": 1}, mapG);
    let cy = ly + 17;
    for (const r of rows) {
      if (r.header !== undefined) {
        el("text", {x: lx + 8, y: cy + 3, "font-size": 11, fill: "#444", "font-weight": 600}, mapG, r.header);
        cy += 23;
        continue;
      }
      if (r.kind === "point") {
        const gx = lx + 14, gy = cy - 4, gs = Math.max(4, Math.min(r.size || 6, 9));
        const glyph = shapeGlyph(r.shape, gx, gy, gs);
        if (glyph) el("path", {d: glyph, fill: r.fill, stroke: r.stroke, "stroke-width": 1.4,
                               "stroke-linejoin": "miter"}, mapG);
        else el("circle", {cx: gx, cy: gy, r: 6, fill: r.fill,
                           stroke: r.stroke || "#fff", "stroke-width": 1.4}, mapG);
      } else if (r.kind === "poly") el("rect", {x: lx + 8, y: cy - 8, width: 12, height: 8, fill: r.fill,
                                              stroke: r.stroke !== "none" ? r.stroke : "none"}, mapG);
      else el("line", {x1: lx + 8, x2: lx + 20, y1: cy - 4, y2: cy - 4, stroke: r.stroke, "stroke-width": 2.5,
                       "stroke-dasharray": r.dash || "none"}, mapG);
      el("text", {x: lx + 26, y: cy, "font-size": 11, fill: "#222",
                  "font-style": r.italic ? "italic" : "normal"}, mapG, r.label);
      cy += 17;
    }
  }
  // free-floating place-name annotations (lon/lat-anchored, layer-independent —
  // e.g. italic grey "Sumatra" / "Borneo" / "South China Sea" labels)
  for (const a of SPEC.annotations || []) {
    const q = proj([a.lon, a.lat]); if (!q) continue;
    const size = a.size || 10, lines = String(a.text).split("\n");
    const t = el("text", {x: q[0], y: q[1], "font-size": size, fill: a.color || "#666",
                "font-style": a.italic === false ? "normal" : "italic",
                "text-anchor": a.anchor || "middle",
                "paint-order": "stroke", stroke: "rgba(255,255,255,0.9)", "stroke-width": 3}, mapG);
    lines.forEach((ln, i) => el("tspan", {x: q[0], dy: i === 0 ? 0 : size * 1.25}, t, ln));
  }
  // map frame
  el("rect", {x: PAD - 1, y: PAD - 1, width: W - 2 * PAD + 2, height: H - 2 * PAD + 2,
              fill: "none", stroke: "#9aa0a6", "stroke-width": 1}, svg);
  document.getElementById("chart").appendChild(svg);
})();
</script>
<script>
/* ---- chartz print-export module (identical across template-native engines; v0.8.0) ----
   SPEC.export (optional, all keys optional):
     width_mm    - journal column width (e.g. 89 = Nature single column). With dpi, sets the
                   Download PNG raster deterministically: px = mm / 25.4 * dpi (default: 2x screen).
                   Download SVG then carries width/height in mm units (true print vector).
     dpi         - raster density for Download PNG (default 300).
     font_family - overrides the system-ui stack in both exports (journals: "Arial"). */
(function () {
  var getSvg = function () { return document.querySelector('#chart svg'); };
  var baseName = function () {
    return (document.getElementById('chart-title').textContent || 'chart').replace(/\s+/g, '_');
  };
  function exportScale(el) {
    var ex = (window.SPEC && SPEC.export) || {};
    if (ex.width_mm && ex.dpi) return (ex.width_mm / 25.4 * ex.dpi) / el.getBoundingClientRect().width;
    return 2;
  }
  function svgWithSize(scale) {
    var src = getSvg().cloneNode(true);
    var bb = getSvg().getBoundingClientRect();
    var w = Math.round(bb.width * scale), h = Math.round(bb.height * scale);
    var mm = ((window.SPEC && SPEC.export && SPEC.export.width_mm) || null);
    src.setAttribute('width', mm ? (mm + 'mm') : w);
    src.setAttribute('height', mm ? (mm * bb.height / bb.width + 'mm') : h);
    if (window.SPEC && SPEC.export && SPEC.export.font_family)
      src.setAttribute('style', 'font-family: ' + SPEC.export.font_family + ', sans-serif;');
    var s = new XMLSerializer().serializeToString(src);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + s;
  }
  function download(name, href) {
    var a = document.createElement('a');
    a.href = href; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(href); a.remove(); }, 800);
  }
  document.getElementById('dl-svg').addEventListener('click', function () {
    var bb = getSvg().getBoundingClientRect();
    var ex = (window.SPEC && SPEC.export) || {};
    var scale = exportScale(getSvg());
    var blob = new Blob([svgWithSize(scale)], {type: 'image/svg+xml'});
    download(baseName() + '.svg', URL.createObjectURL(blob));
  });
  document.getElementById('dl-png').addEventListener('click', function () {
    var scale = exportScale(getSvg());
    var bb = getSvg().getBoundingClientRect();
    var svgStr = svgWithSize(1);
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = Math.round(bb.width * scale); c.height = Math.round(bb.height * scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      download(baseName() + '.png', c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
})();
</script>
</body>
</html>
