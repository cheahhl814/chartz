<!DOCTYPE html>

<head>

<title>chartz · Cytoscape.js 3.34.3</title>

<script>
const SPEC = /*__SPEC__*/;
document.getElementById('chart-title').textContent = SPEC.title || 'Network graph';
cytoscape({
  container: document.getElementById('cy'),
  elements: SPEC.elements,
  style: SPEC.style,
  layout: SPEC.layout || { name: 'cose', animate: false }
